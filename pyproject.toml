[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetlens"
version = "0.1.0"
description = "Validated fleet telemetry contracts and analysis"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
fleetlens = "fleetlens.cli:main"
fleetlens-validate = "fleetlens.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
target-version = ["py311"]
line-length = 88
